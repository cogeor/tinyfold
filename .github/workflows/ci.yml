name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (CPU torch + package)
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the runner light (no CUDA download).
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run tests (skip data/GPU integration tests)
        # The slow/integration tests need the DIPS-Plus parquet, cached ESM
        # embeddings, and trained checkpoints, none of which exist on a fresh CI
        # checkout. They self-skip via exists()-guards too, but excluding the
        # markers keeps CI fast and unambiguous.
        run: pytest -m "not slow and not integration" -q
