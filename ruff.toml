line-length = 100
target-version = "py310"

# Vendored baseline code (DiffDock-PP clone + adapters) and scratch files are not ours to lint.
extend-exclude = ["benchmarks/baselines", "scratchpad"]

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line-too-long — research code has long lines / equations; not worth churn
    "E741",   # ambiguous variable name (l, L, O) — common in tensor/math code
    "E731",   # lambda-assignment
    "E402",   # module-import-not-at-top (scripts do sys.path setup before imports)
    "E701",   # multiple-statements-on-one-line (colon)
    "E702",   # multiple-statements-on-one-line (semicolon)
    "RUF022", # unsorted __all__ — ordering is grouped-by-topic on purpose
    "B008",   # function-call-in-default-argument
    "B905",   # zip-without-explicit-strict — noisy; equal-length is the norm here
    "B007",   # unused-loop-control-variable
    "B023",   # function-uses-loop-variable — pre-existing; flagged for manual review, not autofixed
    "F841",   # unused local — often kept for readability in research code
    "SIM108", # ternary-instead-of-if-else — not always clearer
    "SIM102", # collapsible-if
    "SIM115", # open-without-context-handler — sometimes intentional in scripts
    "SIM116", # if-else chain instead of dict
    "SIM117", # multiple-with-statements
    "SIM118", # in-dict-keys
    "RUF001", # ambiguous unicode (intentional em-dashes / Angstrom in docstrings)
    "RUF002",
    "RUF003",
    "RUF005", # collection-literal-concatenation
    "RUF059", # unused unpacked variable — the `x, _ = f()` idiom is pervasive
]

[lint.isort]
known-first-party = ["tinyfold"]

[lint.per-file-ignores]
"scripts/*" = ["T20"]           # scripts legitimately use print() for output
"tests/*" = ["B011", "SIM"]     # asserts + explicit test style
