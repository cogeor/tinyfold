# Coevolution A/B — le240 TEMPLATE+COEVOLUTION arm (A1). 6M pair track, <=240 res.
#
# The treatment arm (SPEC §1): pair track + retrieved template + APC-corrected
# coevolution features injected into the same pair channel (additive, zero-init).
# Byte-matched to coev_6M_le240_template EXCEPT msa_cond/msa_cache_dir, so the A/B
# isolates the coevolution prior on top of templates.
#
# Launch with --template_cache_dir <retrieval cache> (CLI, as the retr_* arms do).
# msa_cache_dir is our own coevolution cache (prepare_msa_features.py, key
# 'msa_feats'); it must cover every sample_id in this split's train+test.

model_kind: onestep
mode: stage1_only

n_train: 5000
n_test: 200
n_eval_train: 200
min_atoms: 0
max_atoms: 960
batch_size: 1
grad_accum: 4
dynamic_batch: false
use_bucketing: false

n_steps: 36000
eval_every: 3000
lr: 1.0e-04
min_lr: 1.0e-05
seed: 42

c_token_s1: 192
trunk_layers: 6
denoiser_blocks: 6
atom_head_layers: 2
atom_head_heads: 4

aa_embed: esm2_35M
per_chain_res_idx: true

global_scale: 11.0
crop_strategy: none
relpos_bias: true
relpos_clip: 32
pair_repr: true
c_pair: 64
pair_layers: 3
pair_hidden: 64

# --- Templates ON + coevolution ON (treatment) ---
template_cond: true
template_source: retrieved
msa_cond: true
msa_cache_dir: data/processed/msa_feats

T: 50
continuous_sigma: true
sigma_data: 1.0
sigma_min: 0.002
sigma_max: 10.0

confidence_head: true
confidence_head_weight: 0.1
rank_by: self_consistency

loss_weighting: true
augment_rotation: true
multi_copy: 0
self_cond_prob: 0.0
dist_weight: 0.1
geom_weight: 0.1
contact_weight: 0.0
atom_weight: 0.5
atom_warmup_steps: 500

one_shot_sample: true
n_samples: 20
eval_K_list: "1,5,20"
cluster_radius: 5.0

eval_train_dockq: true

output_dir: outputs/resfold/coev_6M_le240_template_coev
