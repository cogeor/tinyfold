# Smoke A: BASELINE - current per-sample normalization (sigma_data=1, sigma_max=10).
# Tiny train run (~5 min) to set a baseline for the smoke matrix.
# Uses DiffDock-PP family-clustered split for clean comparison to method B.

model_kind: onestep
mode: stage1_only
load_split: data/processed/splits/diffdock_pp_smoke.json

# --- Training ---
n_steps: 3000
eval_every: 1000
lr: 1.0e-04
min_lr: 1.0e-05
grad_accum: 1
seed: 42
batch_size: 16
dynamic_batch: false
use_bucketing: false

# --- Architecture (Phase D defaults) ---
c_token_s1: 256
trunk_layers: 6
denoiser_blocks: 6
atom_head_layers: 2
atom_head_heads: 4
aa_embed: esm2_35M

# --- Diffusion (current per-sample-norm convention) ---
T: 50
continuous_sigma: true
sigma_data: 1.0
sigma_min: 0.002
sigma_max: 10.0
# Keep per-sample normalization ON (default; no --no_normalize)

# --- Other ---
confidence_head: false
loss_weighting: true
augment_rotation: true
multi_copy: 0
self_cond_prob: 0.0
dist_weight: 0.1
geom_weight: 0.1
contact_weight: 0.0
atom_weight: 0.5
atom_warmup_steps: 200
one_shot_sample: true
n_samples: 1
eval_K_list: "1"

output_dir: outputs/resfold/smoke_a_normalized
