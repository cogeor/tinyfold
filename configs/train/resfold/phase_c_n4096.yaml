# Phase C — N=4096 at [200, 1200]. Same architecture as N=1024.

model_kind: onestep

# --- Data ---
n_train: 4096
n_test: 100
n_eval_train: 128
min_atoms: 200
max_atoms: 1200
batch_size: 32
dynamic_batch: false
use_bucketing: false
n_buckets: 8
max_tokens: 30000

# --- Training ---
n_steps: 50000
eval_every: 5000
lr: 1.0e-04
min_lr: 1.0e-05
grad_accum: 1
seed: 42

mode: stage1_only

c_token_s1: 256
trunk_layers: 6
denoiser_blocks: 6
atom_head_layers: 2
atom_head_heads: 4

T: 50
continuous_sigma: true

augment_rotation: true
multi_copy: 0
translate_aug: 0.0
self_cond_prob: 0.0

dist_weight: 0.1
geom_weight: 0.1
contact_weight: 0.0
atom_weight: 0.5
atom_warmup_steps: 500

one_shot_sample: true

output_dir: outputs/resfold/phase_c_n4096
