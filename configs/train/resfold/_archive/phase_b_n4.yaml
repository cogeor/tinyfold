# Phase B (ResFoldOneStep) — scaling sweep at N=4. n_steps follows 4000 * sqrt(N).
# Same Phase A architecture (c_token=128, trunk=4, denoiser=4) — NEXT_STEPS.md
# §3.1 says hold the model fixed until N=256.

# --- Model selection ---
model_kind: onestep

# --- Data ---
n_train: 4
n_test: 14
n_eval_train: 4
min_atoms: 200
max_atoms: 400
batch_size: 4
dynamic_batch: false
use_bucketing: false
n_buckets: 8
max_tokens: 30000

# --- Training ---
n_steps: 8000
eval_every: 1000
lr: 0.001
min_lr: 1.0e-05
grad_accum: 1
seed: 42

# --- Mode ---
mode: stage1_only

# --- Model (Phase A architecture, held fixed) ---
c_token_s1: 128
trunk_layers: 4
denoiser_blocks: 4
atom_head_layers: 2
atom_head_heads: 4

# --- Diffusion ---
T: 50
continuous_sigma: true

# --- Augmentation OFF (Phase A discipline) ---
augment_rotation: false
multi_copy: 0
translate_aug: 0.0
self_cond_prob: 0.0

# --- Loss weights ---
dist_weight: 0.1
geom_weight: 0.1
contact_weight: 0.0
atom_weight: 0.5
atom_warmup_steps: 500

# --- Eval sampler ---
# Phase B open question: does multi-step Euler drift disappear with diverse
# training data? Leave one_shot_sample OFF so we exercise the full T=50
# trajectory. If train RMSE plateaus high, re-enable one_shot_sample and we'll
# know the model overfit but the sampler is still broken (a real Phase A
# finding rather than a Phase B failure).
one_shot_sample: true

# --- Output ---
output_dir: outputs/resfold/phase_b_n4
