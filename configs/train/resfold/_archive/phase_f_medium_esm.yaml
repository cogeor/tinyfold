# Phase F-medium-ESM: F-medium recipe + ESM-2 35M frozen embeddings.
# Tests whether ESM features compensate for the reduced small-protein training
# data, closing F-medium's small-bin gap (15.33 A) toward Phase D's 7.66 A while
# preserving F-medium's mid-bin wins (16-17 A).

model_kind: onestep
mode: stage1_only
load_split: data/processed/splits/phase_f_medium.json

n_steps: 20000
eval_every: 2000
lr: 1.0e-04
min_lr: 1.0e-05
grad_accum: 1
seed: 42
batch_size: 16
dynamic_batch: true
use_bucketing: true
n_buckets: 4
max_tokens: 20000

c_token_s1: 256
trunk_layers: 6
denoiser_blocks: 6
atom_head_layers: 2
atom_head_heads: 4

# THE TWO DELTAS from F-medium:
aa_embed: esm2_35M
per_chain_res_idx: true

T: 50
continuous_sigma: true
sigma_data: 1.0
sigma_min: 0.002
sigma_max: 10.0

confidence_head: false
loss_weighting: true
augment_rotation: true
multi_copy: 0
self_cond_prob: 0.0
dist_weight: 0.1
geom_weight: 0.1
contact_weight: 0.0
atom_weight: 0.5
atom_warmup_steps: 200
one_shot_sample: true
n_samples: 1
eval_K_list: "1"

output_dir: outputs/resfold/phase_f_medium_esm
