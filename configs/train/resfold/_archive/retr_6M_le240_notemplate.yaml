# Retrieval library — E1 CONTROL: 6M, pair track, NO template, <=240 res.
#
# Matched arm for the template runs (retr_6M_le240_oracle / _template): identical
# architecture INCLUDING the pair track (pair_repr: true), so the ONLY difference
# vs the template arms is whether a template is fed. This isolates the template
# effect, not "pair track vs no pair track".
#
# The pair track is O(L^2); at batch 32 x L=240 it OOMs on 16GB. We use
# batch 8 x grad_accum 4 (eff batch 32, same as the scaling-map recipe) to keep
# full complexes (no crop) while fitting memory.

model_kind: onestep
mode: stage1_only

# --- Data: total residues <= 240 (atoms <= 960) ---
n_train: 5000
n_test: 200
n_eval_train: 200
min_atoms: 0
max_atoms: 960
batch_size: 8
grad_accum: 4
dynamic_batch: false
use_bucketing: false

# --- Training ---
n_steps: 36000
eval_every: 3000
lr: 1.0e-04
min_lr: 1.0e-05
seed: 42

# --- Architecture: ~6.7M params (c192) + pair track ---
c_token_s1: 192
trunk_layers: 6
denoiser_blocks: 6
atom_head_layers: 2
atom_head_heads: 4

aa_embed: esm2_35M
per_chain_res_idx: true

global_scale: 11.0
crop_strategy: none
relpos_bias: true
relpos_clip: 32
pair_repr: true
c_pair: 64
pair_layers: 3
pair_hidden: 64

# --- Template: OFF ---
template_cond: false
template_source: none

T: 50
continuous_sigma: true
sigma_data: 1.0
sigma_min: 0.002
sigma_max: 10.0

confidence_head: true
confidence_head_weight: 0.1
rank_by: self_consistency

loss_weighting: true
augment_rotation: true
multi_copy: 0
self_cond_prob: 0.0
dist_weight: 0.1
geom_weight: 0.1
contact_weight: 0.0
atom_weight: 0.5
atom_warmup_steps: 500

one_shot_sample: true
n_samples: 20
eval_K_list: "1,5,20"
cluster_radius: 5.0

eval_train_dockq: true

output_dir: outputs/resfold/retr_6M_le240_notemplate
