# Smoke B: BOLTZ-STYLE - no per-sample normalization (sigma_data=16, sigma_max=160).
# Same data + arch as Smoke A. Only deltas:
#   no_normalize: true  -> coords stay in Angstroms (centered only).
#   sigma_data: 16.0    -> EDM constant matches physical std of DIPS centroids.
#   sigma_max: 160.0    -> sampler reaches noise of ~Karras range in Angstroms.
#   sigma_min: 4.0e-4   -> Boltz/AF3 default.

model_kind: onestep
mode: stage1_only
load_split: data/processed/splits/diffdock_pp_smoke.json

# --- Training ---
n_steps: 3000
eval_every: 1000
lr: 1.0e-04
min_lr: 1.0e-05
grad_accum: 1
seed: 42
batch_size: 16
dynamic_batch: false
use_bucketing: false

# --- Architecture (same as Smoke A) ---
c_token_s1: 256
trunk_layers: 6
denoiser_blocks: 6
atom_head_layers: 2
atom_head_heads: 4
aa_embed: esm2_35M

# --- Diffusion (Boltz/AF3 convention) ---
T: 50
continuous_sigma: true
no_normalize: true
sigma_data: 16.0
sigma_min: 4.0e-4
sigma_max: 160.0

# --- Other ---
confidence_head: false
loss_weighting: true
augment_rotation: true
multi_copy: 0
self_cond_prob: 0.0
dist_weight: 0.1
geom_weight: 0.1
contact_weight: 0.0
atom_weight: 0.5
atom_warmup_steps: 200
one_shot_sample: true
n_samples: 1
eval_K_list: "1"

output_dir: outputs/resfold/smoke_b_physical
