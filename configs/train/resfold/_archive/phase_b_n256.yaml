# Phase B (ResFoldOneStep) — scaling sweep at N=256. n_steps follows 4000 * sqrt(N).
# Last Phase B step before Phase C; NEXT_STEPS.md §3.1 allows bumping the model
# from Phase A size at N=256, but we hold it fixed here to keep the scaling
# comparison apples-to-apples. Phase C will sweep capacity separately.

model_kind: onestep

# --- Data ---
n_train: 256
n_test: 14
n_eval_train: 64
# [200, 600] -> 1198 eligible samples (vs 94 in [200,400]). Larger proteins
# (avg ~150 residues) mean ~3x more compute per step than N<=64 runs.
# Documented for the scaling plot: data filter changes from N=64 to N=256.
min_atoms: 200
max_atoms: 600
batch_size: 32
dynamic_batch: false
use_bucketing: false
n_buckets: 8
max_tokens: 30000

# --- Training ---
n_steps: 64000
eval_every: 8000
lr: 0.001
min_lr: 1.0e-05
grad_accum: 1
seed: 42

# --- Mode ---
mode: stage1_only

# --- Model (Phase A architecture, held fixed) ---
c_token_s1: 128
trunk_layers: 4
denoiser_blocks: 4
atom_head_layers: 2
atom_head_heads: 4

# --- Diffusion ---
T: 50
continuous_sigma: true

# --- Augmentation OFF (Phase A discipline) ---
augment_rotation: false
multi_copy: 0
translate_aug: 0.0
self_cond_prob: 0.0

# --- Loss weights ---
dist_weight: 0.1
geom_weight: 0.1
contact_weight: 0.0
atom_weight: 0.5
atom_warmup_steps: 500

# --- Eval sampler ---
one_shot_sample: true

# --- Output ---
output_dir: outputs/resfold/phase_b_n256
