# Phase A (ResFoldOneStep) — overfit on a single sample to validate the
# centroid+atom end-to-end wiring.
#
# Same diffusion settings as phase_a_overfit.yaml, with model_kind: onestep so
# the training script attaches the atom head and the atom-MSE + geometry losses
# get computed alongside the centroid MSE. Total params at this config: ~2.1M
# (vs 1.8M for centroid-only Phase A).

# --- Model selection ---
model_kind: onestep

# --- Data ---
n_train: 1
n_test: 14
n_eval_train: 1
min_atoms: 200
max_atoms: 400
batch_size: 1
dynamic_batch: false
use_bucketing: false
n_buckets: 8
max_tokens: 30000

# --- Training ---
n_steps: 5000
eval_every: 500
lr: 0.001
min_lr: 1.0e-05
grad_accum: 1
seed: 42

# --- Mode ---
mode: stage1_only

# --- Model (smaller than defaults) ---
c_token_s1: 128
trunk_layers: 4
denoiser_blocks: 4
atom_head_layers: 2
atom_head_heads: 4

# --- Diffusion ---
T: 50
continuous_sigma: true

# --- Eval sampler ---
# Phase A is an overfit test; the multi-step Euler sampler accumulates drift
# even when the model is essentially perfect at every individual sigma. One-shot
# inference at sigma_max recovers the memorized structure directly. For larger
# training sets (Phase B/C) this flag should usually be off so the full
# diffusion trajectory is exercised.
one_shot_sample: true

# --- Augmentation OFF for clean overfit signal ---
augment_rotation: false
multi_copy: 0
translate_aug: 0.0
self_cond_prob: 0.0

# --- Loss weights ---
# Centroid MSE is the diffusion target — kept at 1.0 (implicit).
# Atom MSE ramps in via warmup; alpha after warmup is set by atom_weight.
# Geometry losses apply to the atom head's output only.
dist_weight: 0.1
geom_weight: 0.1
contact_weight: 0.0
atom_weight: 0.5
atom_warmup_steps: 500

# --- Output ---
output_dir: outputs/resfold/phase_a_overfit_onestep
