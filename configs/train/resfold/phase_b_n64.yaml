# Phase B — scaling sweep at N=64. n_steps follows 4000 * sqrt(N).
# Model knobs return to script defaults (c_token_s1=256, trunk_layers=9,
# denoiser_blocks=7), matching the stage1_10M lineage.
#
# TODO(loop-08): output_dir below is a per-phase base; Loop 08's auto-append hook
# should append a generate_run_name() timestamped subdir before makedirs.

# --- Data ---
n_train: 64
n_test: 14
n_eval_train: 200
min_atoms: 200
max_atoms: 400
batch_size: 64
dynamic_batch: false
use_bucketing: false
n_buckets: 8
max_tokens: 30000

# --- Training ---
n_steps: 32000
eval_every: 1000
lr: 0.001
min_lr: 1.0e-05
grad_accum: 1
seed: 42

# --- Mode ---
mode: stage1_only

# --- Diffusion ---
T: 50
continuous_sigma: true

# --- Loss weights ---
dist_weight: 0.1
geom_weight: 0.1
contact_weight: 0.0

# --- Output ---
output_dir: outputs/resfold/phase_b_n64
