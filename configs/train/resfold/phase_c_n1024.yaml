# Phase C (ResFoldOneStep) — first scaling step beyond Phase B's small filter.
# Architecture matches stage1_10M (c_token=256, trunk=6, denoiser=6, ~6M params)
# for apples-to-apples comparison with the historical reference run.
# Data filter [200, 1200] also matches stage1_10M (8722 eligible samples).

model_kind: onestep

# --- Data ---
n_train: 1024
n_test: 100
n_eval_train: 64
min_atoms: 200
max_atoms: 1200
batch_size: 32
dynamic_batch: false
use_bucketing: false
n_buckets: 8
max_tokens: 30000

# --- Training ---
n_steps: 50000
eval_every: 5000
lr: 1.0e-04
min_lr: 1.0e-05
grad_accum: 1
seed: 42

# --- Mode ---
mode: stage1_only

# --- Model (stage1_10M architecture) ---
c_token_s1: 256
trunk_layers: 6
denoiser_blocks: 6
atom_head_layers: 2
atom_head_heads: 4

# --- Diffusion ---
T: 50
continuous_sigma: true

# --- Augmentation ---
# Phase C reintroduces rotation augmentation: with diverse data we want the
# model to be rotation-equivariant. self_cond_prob defaults to 0 (we're not
# in the multi-step sampler regime anyway).
augment_rotation: true
multi_copy: 0
translate_aug: 0.0
self_cond_prob: 0.0

# --- Loss weights ---
dist_weight: 0.1
geom_weight: 0.1
contact_weight: 0.0
atom_weight: 0.5
atom_warmup_steps: 500

# --- Eval sampler ---
one_shot_sample: true

# --- Output ---
output_dir: outputs/resfold/phase_c_n1024
