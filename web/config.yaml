# NOTE: web/server.py is not yet onestep-native (tracked as loop 09 of the
# refactor). This config now points at the live small-specialist (onestep)
# checkpoint instead of the long-dead af3_15M_gaussian_5K path; full server
# support for architecture: onestep lands in loop 09.
model:
  checkpoint: "../outputs/resfold/small_specialist_le200/resfold_s1_3K_20260613_161213/best_model.pt"
  architecture: "onestep"

inference:
  noise_type: "gaussian"
  n_timesteps: 50
  clamp_val: 3.0

data:
  samples_path: "../data/processed/samples.parquet"
  min_atoms: 0
  max_atoms: 800
  n_train: 3000
  n_test: 200

# Optional: pre-computed predictions (set to null or remove to use live inference)
predictions:
  cache_path: "predictions.json"

server:
  host: "127.0.0.1"
  port: 5001
